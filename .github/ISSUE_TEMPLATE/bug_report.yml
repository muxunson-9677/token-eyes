name: 问题反馈
description: 报告社区预览版中的异常，欢迎附脱敏截图。
title: "[bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Token Eyes 版本与安装方式
      placeholder: 例如 0.54.50，Windows x64 安装包
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 系统版本
      placeholder: 例如 Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 操作步骤与实际结果
      description: 请说明如何复现；截图请先遮盖个人信息。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我没有附上真实密钥、Cookie、账号文件、完整对话或私人日志。
          required: true
