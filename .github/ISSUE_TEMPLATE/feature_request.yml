name: 功能建议
description: 提出想法、改进或新的数据源支持。
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的使用方式
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: 可提供的帮助
      description: 例如复现步骤、脱敏样本、文档或代码；可以留空。
