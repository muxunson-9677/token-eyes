name: 文档改进
description: 报告说明不清楚、链接错误或缺少的文档。
title: "[docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: 文档或页面地址
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 问题和建议
    validations:
      required: true
