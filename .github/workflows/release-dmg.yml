name: release (macOS + Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
      notes:
        description: One-line English release note
        type: string
        required: true

concurrency:
  group: release-desktop-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate version input
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be X.Y.Z"
            exit 1
          fi
          LC_ALL=C
          if [[ ! "$RELEASE_NOTES" =~ ^[[:print:]]+$ || -z "${RELEASE_NOTES//[[:space:]]/}" ]]; then
            echo "Release notes must be one non-empty English/ASCII line"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Create draft release
        run: gh release create "v${{ inputs.version }}" --draft --title "v${{ inputs.version }}" --notes "$RELEASE_NOTES"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ inputs.notes }}

  build:
    needs: create-release
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci --prefix dashboard
      - name: Verify version
        run: |
          CURRENT_VERSION=$(jq -r '.version' package.json)
          PROJECT_VERSIONS=$(grep 'MARKETING_VERSION:' TokenTrackerBar/project.yml | sed -E 's/.*"([^"]+)"/\1/' | sort -u)
          if [ "$CURRENT_VERSION" != "${{ inputs.version }}" ]; then
            echo "Version mismatch: package.json has $CURRENT_VERSION, input is ${{ inputs.version }}"
            exit 1
          fi
          if [ "$PROJECT_VERSIONS" != "${{ inputs.version }}" ]; then
            echo "Version mismatch: project.yml has $PROJECT_VERSIONS, input is ${{ inputs.version }}"
            exit 1
          fi
      - name: Build dashboard
        run: npm run dashboard:build
      - name: Bundle EmbeddedServer
        run: bash TokenTrackerBar/scripts/bundle-node.sh
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Generate Xcode project
        working-directory: TokenTrackerBar
        run: xcodegen generate
      - name: Patch icon
        working-directory: TokenTrackerBar
        run: ruby scripts/patch-pbxproj-icon.rb
      - name: Build with xcodebuild
        working-directory: TokenTrackerBar
        run: xcodebuild -project TokenTrackerBar.xcodeproj -scheme TokenTrackerBar -configuration Release -destination 'platform=macOS' -derivedDataPath build/DerivedData clean build
      - name: Ad-hoc sign inner Mach-O and outer .app
        run: |
          APP_PATH="TokenTrackerBar/build/DerivedData/Build/Products/Release/TokenTrackerBar.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: TokenTrackerBar.app not found at $APP_PATH"
            exit 1
          fi
          codesign --sign - --force "$APP_PATH/Contents/Resources/EmbeddedServer/node"
          codesign --sign - --force --entitlements TokenTrackerBar/TokenTrackerBar/TokenTrackerBar.entitlements "$APP_PATH"
      - name: Create DMG
        run: bash TokenTrackerBar/scripts/create-dmg.sh TokenTrackerBar/build/DerivedData/Build/Products/Release/TokenTrackerBar.app
      - name: Upload DMG
        run: gh release upload "v${{ inputs.version }}" TokenTrackerBar/build/TokenTrackerBar.dmg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    needs: create-release
    uses: ./.github/workflows/release-windows.yml
    with:
      version: ${{ inputs.version }}
      notes: ${{ inputs.notes }}
    permissions:
      contents: write

  publish:
    needs: [build, windows]
    runs-on: ubuntu-latest
    env:
      HOMEBREW_DISPATCH_TOKEN: ${{ secrets.HOMEBREW_DISPATCH_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        run: gh release edit "v${{ inputs.version }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Notify Homebrew tap
        if: env.HOMEBREW_DISPATCH_TOKEN != ''
        run: gh workflow run release.yml --repo mm7894215/homebrew-tokentracker --ref main
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_DISPATCH_TOKEN }}
