name: npm Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish the current package version to npm
        required: true
        type: boolean
        default: false

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm ci --prefix dashboard
      - run: npm test
      - run: npm --prefix dashboard run typecheck
      - run: npm --prefix dashboard run lint
      - run: npm --prefix dashboard run test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          # Unit tests do not package the Windows runtime. The release build
          # still supplies this versioned resource via tauri:prepare-runtime.
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
      - run: npm run validate:copy
      - run: npm run validate:ui-hardcode
      - run: npm run validate:guardrails
      - run: npm run providers:check

  publish:
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_npm == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check if version already published
        id: version-check
        run: |
          CURRENT_VERSION=$(jq -r '.version' package.json)
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "has-npm-token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-npm-token=false" >> "$GITHUB_OUTPUT"
          fi
          if npm view tokentracker-cli@$CURRENT_VERSION version >/dev/null 2>&1; then
            echo "version-exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "version-exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install root dependencies
        if: steps.version-check.outputs.version-exists == 'false' && steps.version-check.outputs.has-npm-token == 'true'
        run: npm ci
      - name: Install dashboard dependencies
        if: steps.version-check.outputs.version-exists == 'false' && steps.version-check.outputs.has-npm-token == 'true'
        run: npm ci --prefix dashboard
      - name: Build dashboard
        if: steps.version-check.outputs.version-exists == 'false' && steps.version-check.outputs.has-npm-token == 'true'
        run: npm run dashboard:build
      - name: Publish to npm
        if: steps.version-check.outputs.version-exists == 'false' && steps.version-check.outputs.has-npm-token == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Skip npm publish without token
        if: steps.version-check.outputs.version-exists == 'false' && steps.version-check.outputs.has-npm-token != 'true'
        run: echo "NPM_TOKEN is not configured; package publication was skipped."
