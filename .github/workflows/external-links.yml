name: external links

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify offline link fixtures
        run: npm --loglevel=error run links:check:fixtures

      - name: Check registered external links
        run: npm --loglevel=error run links:check:live -- --output external-links-report.json

      - name: Upload external link report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: external-links-report
          path: external-links-report.json
          if-no-files-found: error
          retention-days: 14
