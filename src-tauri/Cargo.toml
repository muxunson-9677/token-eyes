[package]
name = "token-eyes"
version = "0.1.0"
description = "Token Eyes - AI Token Usage Tracker Desktop"
authors = ["Token Eyes Team"]
license = "MIT"
repository = "https://github.com/mm7894215/TokenTracker"
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "token_eyes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.8.2", features = [] }
tauri-plugin-dialog = "2.2.0"
tauri-plugin-opener = "2.2.0"
